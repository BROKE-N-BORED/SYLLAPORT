  <rect x="64" y="48" width="128" height="160" rx="8" fill="#fffdf6" stroke="#141414" stroke-width="8"/>
  <rect x="80" y="96" width="96" height="24" fill="#b6e61e"/>
  <line x1="80" y1="76" x2="176" y2="76" stroke="#141414" stroke-width="8" stroke-linecap="round"/>
  <line x1="80" y1="144" x2="176" y2="144" stroke="#141414" stroke-width="8" stroke-linecap="round"/>
  <line x1="80" y1="172" x2="144" y2="172" stroke="#141414" stroke-width="8" stroke-linecap="round"/>
</svg>
